name: release

on:
  push:
    tags:
      - 'v*'

# 릴리즈 생성 및 자산 업로드에 필요
permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # Apple Silicon (arm64)
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest' # Intel (x86_64)
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04' # ubuntu-latest(24.04)는 webkit2gtk 호환 이슈로 권장값 사용
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # Linux 빌드 의존성 (Tauri v2 → webkit2gtk 4.1)
      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS에서는 두 아키텍처를 모두 빌드하므로 타깃 추가
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install frontend dependencies
        run: npm ci

      - name: sync app version from tag
        shell: bash
        run: |
          export VERSION="${GITHUB_REF_NAME#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tags must be SemVer, for example v1.2.3 or v1.2.3-beta.1"
            exit 1
          fi

          node <<'EOF'
          const fs = require('fs');

          const configPath = 'src-tauri/tauri.conf.json';
          const config = JSON.parse(fs.readFileSync(configPath, 'utf8'));

          config.version = process.env.VERSION;

          fs.writeFileSync(configPath, `${JSON.stringify(config, null, 2)}\n`);
          console.log(`Using app version ${process.env.VERSION} from tag ${process.env.GITHUB_REF_NAME}`);
          EOF

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # updater 산출물 서명용 키 (repo Secrets에 등록). 설정 시 tauri-action이
          # .sig 파일과 latest.json(업데이트 매니페스트)을 자동 생성·업로드한다.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Whatchadoin v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: false
          # 인앱 업데이터의 /releases/latest · latest.json 엔드포인트는 prerelease를
          # "latest"로 보지 않으므로 정식 릴리즈로 발행해야 업데이트가 동작한다.
          prerelease: false
          args: ${{ matrix.args }}
